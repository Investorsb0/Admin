<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NovaStore Admin</title>

<style>
*{
 box-sizing:border-box;
 font-family:Arial,sans-serif
}

body{
 margin:0;
 background:#f3f4f6;
 color:#172033
}

header{
 background:#111827;
 color:#fff;
 padding:15px
}

.wrap{
 max-width:1100px;
 margin:auto;
 padding:15px
}

.top{
 display:flex;
 align-items:center;
 gap:10px
}

.top h1{
 flex:1
}

.box{
 background:#fff;
 border-radius:13px;
 padding:18px;
 box-shadow:0 2px 9px #0001;
 margin-bottom:15px
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px
}

.stat{
 background:#fff;
 padding:15px;
 border-radius:12px
}

.stat b{
 display:block;
 font-size:25px;
 margin-top:5px
}

.tabs{
 display:flex;
 gap:8px;
 margin-bottom:15px;
 overflow:auto
}

.btn{
 border:0;
 border-radius:8px;
 padding:10px 13px;
 background:#111827;
 color:#fff;
 cursor:pointer
}

.green{
 background:#16a34a
}

.red{
 background:#ef4444
}

.gray{
 background:#6b7280
}

section{
 display:none
}

section.active{
 display:block
}

.field{
 margin:10px 0
}

.field label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-bottom:5px
}

input,textarea,select{
 width:100%;
 padding:11px;
 border:1px solid #ddd;
 border-radius:8px
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.product{
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px 0;
 border-bottom:1px solid #eee
}

.product img{
 width:60px;
 height:60px;
 object-fit:cover;
 border-radius:8px
}

.grow{
 flex:1
}

.table{
 overflow:auto
}

table{
 width:100%;
 border-collapse:collapse
}

th,td{
 padding:10px;
 border-bottom:1px solid #eee;
 text-align:left;
 font-size:13px
}

#login{
 max-width:420px;
 margin:70px auto
}

.note{
 background:#eef2ff;
 padding:10px;
 border-radius:8px;
 font-size:13px;
 margin-bottom:12px
}

@media(max-width:650px){

 .stats{
  grid-template-columns:1fr 1fr
 }

 .row{
  grid-template-columns:1fr
 }

 .product{
  flex-wrap:wrap
 }

 .product button{
  flex:1
 }
}
</style>
</head>

<body>

<div id="login" class="box">

<h2>NovaStore Admin</h2>

<p>Sign in with the authorized admin account.</p>

<div class="field">
<label>Email</label>
<input id="le" type="email">
</div>

<div class="field">
<label>Password</label>
<input id="lp" type="password">
</div>

<button class="btn green" onclick="adminLogin()">
Login
</button>

<p id="lm"></p>

</div>


<div id="app" style="display:none">

<header>

<div class="wrap top">

<h1>NovaStore Admin</h1>

<button class="btn gray" onclick="logout()">
Logout
</button>

</div>

</header>


<div class="wrap">


<div class="stats">

<div class="stat">
Products
<b id="sp">0</b>
</div>

<div class="stat">
Orders
<b id="so">0</b>
</div>

<div class="stat">
Customers
<b id="sc">0</b>
</div>

<div class="stat">
Pending
<b id="sn">0</b>
</div>

</div>


<div class="tabs">

<button class="btn green"
onclick="tab('psec')">
Products
</button>

<button class="btn"
onclick="tab('osec')">
Orders
</button>

<button class="btn"
onclick="tab('csec')">
Customers
</button>

</div>


<section id="psec" class="active">

<div class="box">

<h2 id="ft">
Add Product
</h2>

<div class="note">
Save here → Firebase → the public NovaStore website updates automatically.
</div>

<input id="eid" type="hidden">


<div class="row">

<div class="field">
<label>Product name</label>
<input id="pn">
</div>

<div class="field">
<label>Category</label>
<input id="pc">
</div>

</div>


<div class="row">

<div class="field">
<label>Price (₦)</label>
<input id="pp" type="number">
</div>

<div class="field">
<label>Old price (₦)</label>
<input id="po" type="number">
</div>

</div>


<div class="field">
<label>Image URL</label>
<input id="pi" placeholder="https://...">
</div>


<div class="field">
<label>Description</label>
<textarea id="pd" rows="3"></textarea>
</div>


<button class="btn green"
onclick="saveProduct()">
Save Product
</button>

<button class="btn gray"
onclick="clearForm()">
Clear
</button>

<p id="pm"></p>

</div>


<div class="box">

<h2>Products</h2>

<div id="plist">
Loading...
</div>

</div>

</section>


<section id="osec">

<div class="box">

<h2>Orders</h2>

<div id="olist">
Loading...
</div>

</div>

</section>


<section id="csec">

<div class="box">

<h2>Customers</h2>

<div id="clist">
Loading...
</div>

</div>

</section>


</div>

</div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getDatabase,
 ref,
 onValue,
 push,
 set,
 update,
 remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
 getAuth,
 onAuthStateChanged,
 signInWithEmailAndPassword,
 signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

 apiKey:
 "AIzaSyCNrU3igTkkcQ0Z6Zq1dluKw_s_3yHovE",

 authDomain:
 "novastore-6fd18.firebaseapp.com",

 databaseURL:
 "https://novastore-6fd18-default-rtdb.asia-southeast1.firebasedatabase.app",

 projectId:
 "novastore-6fd18",

 storageBucket:
 "novastore-6fd18.firebasestorage.app",

 messagingSenderId:
 "783420364153",

 appId:
 "1:783420364153:web:1b56b655e3e804726d8ba8",

 measurementId:
 "G-Q760SBLPLT"
};


const app=initializeApp(firebaseConfig);

const db=getDatabase(app);

const auth=getAuth(app);


const ADMIN_EMAIL="sbgodstime@gmail.com";


let products={};

let orders={};

let users={};


const money=n =>
"₦"+Number(n||0).toLocaleString("en-NG");


const safe=s =>
String(s??"").replace(
 /[&<>"']/g,
 c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[c])
);


onAuthStateChanged(auth,u=>{

 if(u && u.email===ADMIN_EMAIL){

  login.style.display="none";

  app.style.display="block";

  start();

 }else{

  login.style.display="block";

  app.style.display="none";

  if(u){

   signOut(auth);

  }

 }

});


window.adminLogin=async()=>{

 try{

  await signInWithEmailAndPassword(
   auth,
   le.value,
   lp.value
  );

  lm.textContent="";

 }catch(e){

  lm.textContent=e.message;

 }

};


window.logout=()=>signOut(auth);


function start(){

 onValue(
  ref(db,"products"),
  s=>{
   products=s.val()||{};
   renderP();
   stats();
  }
 );


 onValue(
  ref(db,"orders"),
  s=>{
   orders=s.val()||{};
   renderO();
   stats();
  }
 );


 onValue(
  ref(db,"users"),
  s=>{
   users=s.val()||{};
   renderC();
   stats();
  }
 );

}


function stats(){

 sp.textContent=
 Object.keys(products).length;

 so.textContent=
 Object.keys(orders).length;

 sc.textContent=
 Object.keys(users).length;

 sn.textContent=
 Object.values(orders)
 .filter(o=>
  (o.status||"pending")==="pending"
 ).length;

}


window.tab=id=>{

 document
 .querySelectorAll("section")
 .forEach(x=>x.classList.remove("active"));

 document
 .getElementById(id)
 .classList.add("active");

};


window.saveProduct=async()=>{

 if(
  !pn.value.trim() ||
  !Number(pp.value)
 ){

  pm.textContent=
  "Product name and price are required.";

  return;

 }


 const data={

  name:pn.value.trim(),

  category:
  pc.value.trim()||"General",

  price:
  Number(pp.value),

  oldPrice:
  Number(po.value)||0,

  image:
  pi.value.trim(),

  description:
  pd.value.trim(),

  available:true,

  updatedAt:
  Date.now()

 };


 try{

  if(eid.value){

   await update(
    ref(db,"products/"+eid.value),
    data
   );

  }else{

   const productRef=
   push(ref(db,"products"));

   await set(
    productRef,
    {
     ...data,
     createdAt:Date.now()
    }
   );

  }

  pm.textContent=
  "Product saved successfully.";

  clearForm();

 }catch(e){

  pm.textContent=e.message;

 }

};


window.clearForm=()=>{

 eid.value="";

 pn.value="";

 pc.value="";

 pp.value="";

 po.value="";

 pi.value="";

 pd.value="";

 ft.textContent="Add Product";

};


function renderP(){

 const list=
 Object.entries(products);


 plist.innerHTML=
 list.length

 ? list.map(([id,p])=>`

 <div class="product">

 ${
  p.image
  ?
  `<img src="${safe(p.image)}">`
  :
  `<div style="width:60px;height:60px;background:#eee;border-radius:8px;display:flex;align-items:center;justify-content:center">
  🛍️
  </div>`
 }

 <div class="grow">

 <b>${safe(p.name)}</b>

 <br>

 <small>
 ${safe(p.category)}
 ·
 ${money(p.price)}
 </small>

 </div>

 <button
 class="btn"
 onclick="editP('${id}')">
 Edit
 </button>

 <button
 class="btn red"
 onclick="delP('${id}')">
 Delete
 </button>

 </div>

 `).join("")

 :

 "<p>No products yet.</p>";

}


window.editP=id=>{

 const p=products[id];

 eid.value=id;

 pn.value=p.name||"";

 pc.value=p.category||"";

 pp.value=p.price||"";

 po.value=p.oldPrice||"";

 pi.value=p.image||"";

 pd.value=p.description||"";

 ft.textContent="Edit Product";

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

};


window.delP=async id=>{

 if(
  confirm("Delete this product?")
 ){

  await remove(
   ref(db,"products/"+id)
  );

 }

};


function renderO(){

 const list=
 Object.entries(orders)
 .sort(
  (a,b)=>
  (b[1].createdAt||0)-
  (a[1].createdAt||0)
 );


 if(!list.length){

  olist.innerHTML=
  "<p>No orders yet.</p>";

  return;

 }


 olist.innerHTML=`

 <div class="table">

 <table>

 <tr>
 <th>Order</th>
 <th>Customer</th>
 <th>Total</th>
 <th>Status</th>
 </tr>

 ${
 list.map(([id,o])=>`

 <tr>

 <td>
 ${id.slice(-8)}
 </td>

 <td>
 ${safe(o.email)}
 </td>

 <td>
 ${money(o.total)}
 </td>

 <td>

 <select
 onchange="changeStatus('${id}',this.value)"
 >

 <option ${
  o.status==="pending"
  ?"selected":""
 }>
 pending
 </option>

 <option ${
  o.status==="processing"
  ?"selected":""
 }>
 processing
 </option>

 <option ${
  o.status==="shipped"
  ?"selected":""
 }>
 shipped
 </option>

 <option ${
  o.status==="delivered"
  ?"selected":""
 }>
 delivered
 </option>

 <option ${
  o.status==="cancelled"
  ?"selected":""
 }>
 cancelled
 </option>

 </select>

 </td>

 </tr>

 `).join("")
 }

 </table>

 </div>

 `;

}


window.changeStatus=(id,status)=>{

 update(
  ref(db,"orders/"+id),
  {
   status:status,
   updatedAt:Date.now()
  }
 );

};


function renderC(){

 const list=
 Object.values(users);


 if(!list.length){

  clist.innerHTML=
  "<p>No customers yet.</p>";

  return;

 }


 clist.innerHTML=`

 <div class="table">

 <table>

 <tr>
 <th>Email</th>
 <th>Joined</th>
 </tr>

 ${
  list.map(u=>`

  <tr>

  <td>
  ${safe(u.email)}
  </td>

  <td>
  ${
   u.createdAt
   ?
   new Date(u.createdAt)
   .toLocaleString()
   :
   "-"
  }
  </td>

  </tr>

  `).join("")
 }

 </table>

 </div>

 `;

}

</script>

</body>
    </html>
